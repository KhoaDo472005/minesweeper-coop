# Đặt vào /etc/nginx/sites-available/minesweeper rồi: ln -s ... /etc/nginx/sites-enabled/
# Đổi mine.example.com thành tên miền phụ của bạn.
server {
    listen 80;
    server_name mine.example.com;

    # WebSocket (bắt buộc phải có Upgrade, nếu thiếu sẽ không vào được phòng)
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}

# Sau đó bật HTTPS (tự sửa file này và gia hạn tự động):
#   sudo certbot --nginx -d mine.example.com
